services:
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      - ./Client:/app
      - /app/node_modules

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    volumes:
      - ./Server:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT:-5000}
      MONGO_URL: ${MONGO_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: "redis://redis:6379"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_URL: ${APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      CLOUDNAME: ${CLOUDNAME}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
      CLOUDINARY_APIKEY: ${CLOUDINARY_APIKEY}
      mailtrap: ${mailtrap}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"

  redis:
    image: redis:7-alpine
    container_name: bridgeIn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
